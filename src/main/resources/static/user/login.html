<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Online Bakery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Link to the Open Sans font -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

<div class="container">
    <h2>Login</h2>
    <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <button class="register-btn" id="createAccountBtn" onclick="window.location.href='register.html'">Create Account</button>
    <button class="logout-btn" id="logoutBtn">Logout</button>

    <div id="userInfo" class="user-info" style="display:none;">
        <h3>User Info</h3>
        <p><strong>Name:</strong> <span id="userName"></span></p>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
        <p><strong>Phone:</strong> <span id="userPhone"></span></p>
        <p><strong>Address:</strong> <span id="userAddress"></span></p>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("http://localhost:8080/users");
            if (!response.ok) {
                throw new Error("Unable to fetch users.");
            }

            const users = await response.json();
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem("loggedInUser", JSON.stringify(user));
                window.location.href = "profile.html";
            } else {
                alert("Invalid email or password.");
            }
        } catch (error) {
            alert("Login failed: " + error.message);
        }
    });

    document.getElementById("logoutBtn").addEventListener("click", function () {
        document.getElementById("loginForm").reset();
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("createAccountBtn").style.display = "block";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("userInfo").style.display = "none";
    });
</script>

</body>
</html>
